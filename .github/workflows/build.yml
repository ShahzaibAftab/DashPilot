name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
      - name: Make Gradlew Executable
        run: chmod +x ./gradlew
      - name: Use the shared signing key
        # Signs GitHub builds with the same key as the Mac builds, so this APK installs over the
        # app already on the car (otherwise Android refuses, and uninstalling wipes DashPilot's
        # settings). Add the key once from the Mac with:
        #   base64 -i ~/.android/debug.keystore | gh secret set DEBUG_KEYSTORE_BASE64
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/debug.keystore"
            echo "DASHPILOT_DEBUG_KEYSTORE=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 secret is not set, so this APK will not install over a Mac build"
          fi
      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest APK
          files: app/build/outputs/apk/debug/app-debug.apk
